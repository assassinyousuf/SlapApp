name: slap_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.6.0
  csv: ^6.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  google_mlkit_face_detection: ^0.13.2
  http: ^1.6.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  sensors_plus: ^7.0.0
  share_plus: ^12.0.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/models/
    - assets/icon.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
